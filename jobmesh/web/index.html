<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Jobmesh — unified job search</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#f6f7f9; --panel:#ffffff; --field:#f1f2f6; --line:#e5e8ee; --line2:#eef0f5;
    --text:#141828; --muted:#6a7280; --soft:#8b93a3; --accent:#5d50e6;
    --gold-1:#e3a600; --gold-2:#c4871a; --remote:#108a6c; --new:#2f9e65;
    --radius:14px; --shadow:0 1px 3px rgba(20,25,40,.05);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.5}
  a{color:inherit;text-decoration:none}

  /* Header */
  header{background:var(--panel);border-bottom:1px solid var(--line)}
  .hwrap{max-width:1180px;margin:0 auto;padding:22px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
  .brand{font-weight:800;font-size:26px;letter-spacing:-.02em}
  .brand .g{background:linear-gradient(92deg,var(--gold-1),var(--gold-2));-webkit-background-clip:text;background-clip:text;color:transparent}
  .brand small{display:block;font-weight:500;font-size:12.5px;color:var(--muted);letter-spacing:0}
  .hstats{display:flex;gap:20px;font-size:13px;color:var(--muted);flex-wrap:wrap}
  .hstats b{color:var(--text);font-weight:700}

  /* Search bar */
  .searchwrap{max-width:1180px;margin:0 auto;padding:20px 24px 4px}
  .search{display:grid;grid-template-columns:1fr 240px auto;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:10px;box-shadow:var(--shadow)}
  .search input{width:100%;border:0;background:var(--field);border-radius:10px;padding:13px 15px;font-size:15px;font-family:inherit;color:var(--text)}
  .search input:focus{outline:none;box-shadow:0 0 0 2px var(--accent) inset}
  .search .go{background:var(--text);color:#fff;border:0;border-radius:10px;padding:0 26px;font-weight:600;font-size:15px;cursor:pointer}
  .search .go:hover{background:#000}

  /* Layout */
  .main{max-width:1180px;margin:0 auto;padding:16px 24px 60px;display:grid;grid-template-columns:248px 1fr;gap:28px;align-items:start}

  /* Sidebar facets */
  .side{position:sticky;top:16px}
  .fgroup{margin-bottom:22px}
  .fgroup h4{margin:0 0 9px;font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--soft)}
  .frow{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:5px 8px;border-radius:8px;cursor:pointer;font-size:13.5px;color:#3c4457}
  .frow:hover{background:#eef0f7}
  .frow .n{color:var(--soft);font-size:12px;font-variant-numeric:tabular-nums}
  .frow.active{background:#efeefe;color:var(--accent);font-weight:600}
  .frow.active .n{color:var(--accent)}
  .clearall{background:none;border:0;color:var(--accent);font-size:12.5px;font-weight:600;cursor:pointer;padding:4px 8px}
  .clearall:hover{text-decoration:underline}

  /* Results */
  .rbar{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:8px;flex-wrap:wrap}
  .rbar .cnt{font-size:22px;font-weight:800;letter-spacing:-.01em}
  .rbar .cnt span{font-weight:500;color:var(--muted);font-size:14px}
  .active-chips{display:flex;gap:7px;flex-wrap:wrap;margin:6px 0 14px}
  .fchip{display:inline-flex;align-items:center;gap:6px;background:#efeefe;color:var(--accent);border:1px solid #e2dffb;font-size:12px;padding:4px 7px 4px 11px;border-radius:999px}
  .fchip b{font-weight:600}
  .fchip button{background:none;border:0;color:var(--accent);cursor:pointer;font-size:14px;line-height:1;padding:0 2px}
  .daygroup{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--soft);margin:18px 2px 10px}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;margin-bottom:11px;box-shadow:var(--shadow);transition:border-color .15s,box-shadow .15s}
  .card:hover{border-color:#d4d9e3;box-shadow:0 5px 16px rgba(20,25,40,.07)}
  .crow{display:flex;gap:13px}
  .av{width:42px;height:42px;border-radius:10px;flex:0 0 42px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:17px}
  .cbody{flex:1;min-width:0}
  .ctop{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
  .ctitle{font-size:16px;font-weight:600;margin:0}
  .ctitle a:hover{color:var(--accent)}
  .ctitle .new{background:var(--new);color:#fff;font-size:9.5px;font-weight:700;letter-spacing:.03em;padding:2px 6px;border-radius:5px;text-transform:uppercase;margin-left:8px;vertical-align:middle}
  .cco{color:var(--muted);font-size:13.5px;margin-top:1px}
  .cco .loc::before{content:"·";margin:0 6px;color:var(--line)}
  .csnip{color:#5a6273;font-size:13px;margin-top:8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
  .chip{background:var(--field);border:1px solid var(--line);color:#525a68;font-size:11.5px;padding:3px 9px;border-radius:999px;white-space:nowrap}
  .chip.badge{color:#fff;border:0;font-weight:500}
  .chip.cat{color:#5a3fb5;background:#efeaff;border-color:#e4ddff}
  .chip.remote{color:var(--remote);background:rgba(16,138,108,.08);border-color:rgba(16,138,108,.28)}
  .chip.salary{color:#8a6300;background:rgba(227,166,0,.1);border-color:rgba(227,166,0,.3)}
  .cside{display:flex;flex-direction:column;align-items:flex-end;gap:8px;flex:0 0 auto}
  .ago{color:var(--soft);font-size:12px;white-space:nowrap}
  .apply{font-size:13px;font-weight:600;color:var(--accent);white-space:nowrap}
  .apply:hover{text-decoration:underline}
  .save{background:none;border:1px solid var(--line);border-radius:8px;color:var(--muted);font-size:12px;padding:5px 10px;cursor:pointer;display:inline-flex;gap:5px;align-items:center}
  .save:hover{border-color:var(--accent);color:var(--accent)}
  .save.on{background:#fff7e6;border-color:var(--gold-1);color:#9a6b00}

  .more{display:block;margin:10px auto 0;background:var(--panel);border:1px solid var(--line);color:var(--text);padding:12px 28px;border-radius:11px;font-size:14px;font-weight:600;cursor:pointer;box-shadow:var(--shadow)}
  .more:hover{border-color:var(--accent);color:var(--accent)}
  .empty{color:var(--muted);text-align:center;padding:50px 0}
  footer{color:#9aa1ad;text-align:center;font-size:12px;padding:10px 0 46px}

  @media(max-width:860px){
    .main{grid-template-columns:1fr}
    .side{position:static;display:grid;grid-template-columns:1fr 1fr;gap:10px 22px}
    .search{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<header>
  <div class="hwrap">
    <div class="brand">Job<span class="g">mesh</span><small>Every job, from every source — one searchable index</small></div>
    <div class="hstats" id="hstats"><span>Loading…</span></div>
  </div>
</header>

<div class="searchwrap">
  <form class="search" id="form" autocomplete="off">
    <input type="text" id="keyword" placeholder="Role or skill — data engineer, python, sql…" />
    <input type="text" id="location" placeholder="Location" />
    <button class="go" type="submit">Search</button>
  </form>
</div>

<div class="main">
  <aside class="side" id="side"></aside>
  <section>
    <div class="rbar">
      <div class="cnt" id="count"></div>
    </div>
    <div class="active-chips" id="active"></div>
    <div id="results"></div>
    <div id="morewrap"></div>
  </section>
</div>

<footer>jobmesh · a unified index of job postings across many ATS and job boards</footer>

<script>
const PCOL={greenhouse:"#2f9e65",lever:"#5a6cf0",ashby:"#b65cff",workable:"#e0567a",smartrecruiters:"#2aa7c7",recruitee:"#e0864f",breezy:"#1fae8f",personio:"#3b5bdb",bamboohr:"#6aae3c",pinpoint:"#e6484d",remotive:"#1f7a8c",arbeitnow:"#d1495b",themuse:"#7b6cf6",remoteok:"#ff6b6b",jobicy:"#20a4f3",himalayas:"#8a63d2",workingnomads:"#e08a3c",weworkremotely:"#2d7dd2"};
const WP={remote:"Remote",hybrid:"Hybrid",onsite:"On-site"};
const AVC=["#5d50e6","#108a6c","#d1495b","#2aa7c7","#e0864f","#7b6cf6","#2f9e65","#c4871a","#e0567a","#20a4f3"];
const FGROUPS=[
  {key:"workplace_type",param:"workplace_type",title:"Workplace",labels:WP},
  {key:"employment_type",param:"employment_type",title:"Job type"},
  {key:"category",param:"category",title:"Domain"},
  {key:"source_platform",param:"platform",title:"Found on"},
];
const PAGE=25;
let offset=0, saved=loadSaved();

const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function loadSaved(){try{return new Set(JSON.parse(localStorage.getItem("jobmesh_saved")||"[]"))}catch(e){return new Set()}}
function persistSaved(){try{localStorage.setItem("jobmesh_saved",JSON.stringify([...saved]))}catch(e){}}

const F={keyword:"",location:"",workplace_type:"",employment_type:"",category:"",platform:""};

function params(extra){
  const p=new URLSearchParams();
  Object.entries(F).forEach(([k,v])=>{if(v)p.set(k,v)});
  if(F.keyword)p.set("keyword",F.keyword);
  if(extra)Object.entries(extra).forEach(([k,v])=>p.set(k,v));
  return p;
}
function hue(s){let h=0;for(const c of (s||"?"))h=(h*31+c.charCodeAt(0))%AVC.length;return AVC[h]}
function relDate(iso){if(!iso)return null;const d=new Date(iso);if(isNaN(d))return null;const dd=Math.floor((Date.now()-d)/86400000);if(dd<=0)return"today";if(dd===1)return"1d ago";if(dd<7)return dd+"d ago";if(dd<35)return Math.floor(dd/7)+"w ago";return d.toLocaleDateString(undefined,{month:"short",day:"numeric"})}
function dayGroup(iso){if(!iso)return"Earlier";const d=new Date(iso);if(isNaN(d))return"Earlier";const dd=Math.floor((Date.now()-d)/86400000);if(dd<=0)return"Today";if(dd<7)return"This week";if(dd<31)return"This month";return"Earlier"}
function isNew(iso){if(!iso)return false;const d=new Date(iso);return !isNaN(d)&&(Date.now()-d)<48*3600*1000}

async function loadHeaderStats(){
  try{const s=await(await fetch("/stats")).json();
    const p=Object.keys(s.open_by_platform||{}).length;
    $("hstats").innerHTML=`<span><b>${s.open_postings.toLocaleString()}</b> open jobs</span><span><b>${p}</b> platforms</span><span><b>${s.boards_indexed}</b> company boards</span>`;
  }catch(e){$("hstats").textContent="Index unreachable"}
}

async function loadFacets(){
  try{
    const f=await(await fetch("/facets?"+params().toString())).json();
    $("count").innerHTML=`${(f.total||0).toLocaleString()} <span>open roles</span>`;
    let html="";
    const anyActive=Object.values(F).some(Boolean);
    for(const g of FGROUPS){
      const counts=f[g.key]||{};
      const entries=Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,8);
      if(!entries.length)continue;
      html+=`<div class="fgroup"><h4>${g.title}</h4>`;
      for(const [val,n] of entries){
        const label=(g.labels&&g.labels[val])||val;
        const active=F[g.param]===val;
        html+=`<div class="frow${active?" active":""}" data-param="${g.param}" data-val="${esc(val)}"><span>${esc(label)}</span><span class="n">${n.toLocaleString()}</span></div>`;
      }
      html+=`</div>`;
    }
    if(anyActive)html+=`<button class="clearall" id="clearall">Clear all filters</button>`;
    $("side").innerHTML=html;
    document.querySelectorAll(".frow").forEach(r=>r.onclick=()=>{
      const p=r.dataset.param,v=r.dataset.val; F[p]=(F[p]===v?"":v); runSearch();
    });
    const ca=$("clearall"); if(ca)ca.onclick=()=>{Object.keys(F).forEach(k=>F[k]="");$("keyword").value="";$("location").value="";runSearch()};
    renderActiveChips();
  }catch(e){}
}

function renderActiveChips(){
  const names={keyword:"Keyword",location:"Location",workplace_type:"Workplace",employment_type:"Job type",category:"Domain",platform:"Found on"};
  const chips=Object.entries(F).filter(([k,v])=>v).map(([k,v])=>{
    const show=k==="workplace_type"?(WP[v]||v):v;
    return `<span class="fchip"><b>${names[k]}:</b> ${esc(show)}<button data-k="${k}">×</button></span>`;
  });
  $("active").innerHTML=chips.join("");
  document.querySelectorAll(".active-chips .fchip button").forEach(b=>b.onclick=()=>{
    const k=b.dataset.k; F[k]=""; if(k==="keyword")$("keyword").value=""; if(k==="location")$("location").value=""; runSearch();
  });
}

function card(j){
  const col=PCOL[j.source_platform]||"#5a6cf0";
  const av=hue(j.company);
  const letter=esc((j.company||"?").trim().charAt(0).toUpperCase()||"?");
  const chips=[];
  if(j.source_platform)chips.push(`<span class="chip badge" style="background:${col}">${esc(j.source_platform)}</span>`);
  if(j.category&&j.category!=="Other")chips.push(`<span class="chip cat">${esc(j.category)}</span>`);
  if(j.workplace_type)chips.push(`<span class="chip remote">${WP[j.workplace_type]||j.workplace_type}</span>`);
  if(j.employment_type)chips.push(`<span class="chip">${esc(j.employment_type)}</span>`);
  if(j.salary)chips.push(`<span class="chip salary">${esc(j.salary)}</span>`);
  const url=j.apply_url||j.source_url||"#";
  const ago=relDate(j.posted_at);
  const badge=isNew(j.first_seen)?`<span class="new">New</span>`:"";
  const snip=j.description?`<div class="csnip">${esc(j.description.slice(0,180))}</div>`:"";
  const on=saved.has(j.uid)?" on":"";
  const savedTxt=saved.has(j.uid)?"Saved":"Save";
  return `<div class="card">
    <div class="crow">
      <div class="av" style="background:${av}">${letter}</div>
      <div class="cbody">
        <div class="ctop">
          <div>
            <h3 class="ctitle"><a href="${esc(url)}" target="_blank" rel="noopener">${esc(j.title||"Untitled")}</a>${badge}</h3>
            <div class="cco">${esc(j.company||"")}${j.location?`<span class="loc">${esc(j.location)}</span>`:""}</div>
          </div>
          <div class="cside">
            ${ago?`<span class="ago">${ago}</span>`:""}
            <a class="apply" href="${esc(url)}" target="_blank" rel="noopener">Apply at source ↗</a>
            <button class="save${on}" data-uid="${esc(j.uid)}">${savedTxt}</button>
          </div>
        </div>
        ${snip}
        <div class="chips">${chips.join("")}</div>
      </div>
    </div>
  </div>`;
}

function renderGroups(rows,append){
  let html="",last=append?window.__lastGroup:null;
  for(const j of rows){
    const g=dayGroup(j.posted_at);
    if(g!==last){html+=`<div class="daygroup">${g}</div>`;last=g;}
    html+=card(j);
  }
  window.__lastGroup=last;
  if(append)$("results").insertAdjacentHTML("beforeend",html);
  else $("results").innerHTML=html||`<div class="empty">No matching jobs. Try a broader search.</div>`;
  bindSave();
}
function bindSave(){
  document.querySelectorAll(".save").forEach(b=>b.onclick=()=>{
    const u=b.dataset.uid;
    if(saved.has(u)){saved.delete(u);b.classList.remove("on");b.textContent="Save";}
    else{saved.add(u);b.classList.add("on");b.textContent="Saved";}
    persistSaved();
  });
}

async function fetchJobs(){const p=params();p.set("limit",PAGE);p.set("offset",offset);return(await(await fetch("/jobs?"+p.toString())).json())}
async function runSearch(){F.keyword=$("keyword").value.trim();F.location=$("location").value.trim();offset=0;window.__lastGroup=null;loadFacets();const d=await fetchJobs();renderGroups(d.results||[],false);renderMore(d)}
async function loadMore(){offset+=PAGE;const d=await fetchJobs();renderGroups(d.results||[],true);renderMore(d)}
function renderMore(d){const shown=offset+(d.results||[]).length;$("morewrap").innerHTML=(d.total&&shown<d.total)?`<button class="more" id="mb">Load more (${(d.total-shown).toLocaleString()} more)</button>`:"";const m=$("mb");if(m)m.onclick=loadMore}

$("form").addEventListener("submit",e=>{e.preventDefault();runSearch()});
loadHeaderStats();runSearch();
</script>
</body>
</html>
