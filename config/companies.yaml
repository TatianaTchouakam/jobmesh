# softgarden — ATS very common in Germany/DACH. Public career feed at
# https://{slug}.career.softgarden.de/jobs.feed.json — slug is the employer's
# softgarden career subdomain. Great for German non-tech employers.
# Oracle Recruiting Cloud — enterprise ATS behind many large NON-TECH
# employers (hospitality, retail, banking, healthcare). Public, keyless.
# Token packs the host and site code (find both in a company's Oracle
# careers URL, e.g. https://{host}/hcmUI/CandidateExperience/.../sites/{site}):
#   {host}:{site}[:CompanyLabel]
