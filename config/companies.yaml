# Workday — enterprise ATS. Token packs three parts the careers URL exposes:
#   tenant:wd{N}:site[:CompanyLabel]
# Find them in a company's Workday careers URL, e.g.
#   https://nvidia.wd5.myworkdayjobs.com/NVIDIAExternalCareerSite
#   -> nvidia : wd5 : NVIDIAExternalCareerSite
# Site ids and datacenter shard (wd1/wd3/wd5/wd12...) vary per company; a
# wrong token is skipped and logged, never fatal — verify live and add more.
workday:
  - nvidia:wd5:NVIDIAExternalCareerSite:NVIDIA

