# Niceboard (niceboard.co) — public keyless /api/jobs on each hosted board.
# board = subdomain slug, OR a full custom host (contains a dot).
# grow with scripts/discover_niceboard.py <candidate hosts...>
niceboard:
  - unitedwayjobbank
  - jobs.forcebrands.com
  - jobs.nonprofittalent.com
  - jobs.aiacolorado.org
  - jobs.aicad.org

# Dover (jobs.dover.com) — public keyless feed; 'all' self-discovers every tenant
# from the careers sitemap. Cap with DOVER_MAX_BOARDS.
dover:
  - all

# Recooty (jobs.recooty.com) — platform-wide sitemap + JSON-LD; 'all' = whole platform
recooty:
  - all


# Manatal (careers-page.com) — public keyless DRF API; board = tenant slug
manatal:
  - hr-ways-3
  - manatal   # Manatal's own board (~33 jobs); add more tenant slugs as found

# Hireology (careers.hireology.com) — public keyless API api.hireology.com/v2/public/careers/{tenant}
hireology:
  - hireology2       # Hireology's own board
  - sandiegopadres   # San Diego Padres

# HiBob (careers.hibob.com) — public keyless /api/job-ad; board = tenant subdomain prefix
hibob:
  - hibob-fa0ad69d0cb34a   # HiBob's own board (~100 jobs)
  - valr          # VALR   # +employeurs vérifiés via recherche 26 nov. 2026 (offres live), confirmer à l'ingest
