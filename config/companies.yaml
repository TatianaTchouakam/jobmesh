# Boards to index, grouped by platform.
#
# A "board" is the company's identifier on that platform. You find it in
# the company's careers URL, e.g.:
#   https://boards.greenhouse.io/gitlab        -> gitlab      (greenhouse)
#   https://jobs.lever.co/leverdemo            -> leverdemo   (lever)
#   https://jobs.ashbyhq.com/ramp              -> ramp        (ashby)
#   https://apply.workable.com/huggingface     -> huggingface (workable)
#   https://jobs.smartrecruiters.com/Ubisoft2  -> Ubisoft2    (smartrecruiters)
#   https://{company}.recruitee.com            -> {company}   (recruitee)
#   https://{company}.breezy.hr                -> {company}   (breezy)
#
# Add a company by dropping its board token on a new line. No code change
# needed. A token that doesn't exist is skipped (logged as a fetch
# failure), so it never breaks the run.

greenhouse:
  - gitlab
  - airbnb
  - stripe
  - figma
  - duolingo
  - robinhood
  - coinbase
  - databricks
  - dropbox
  - brex
  - lyft
  - reddit
  - discord
  - asana
  - cloudflare
  - mongodb
  - instacart

lever:
  - leverdemo
  - spotify
  - palantir
  - zoox
  - whoop
  - gopuff
  - ro
  - entrata

ashby:
  - ramp
  - openai
  - linear
  - elevenlabs
  - notion
  - cursor
  - replit
  - supabase
  - docker
  - modal
  - posthog
  - mercury
  - vercel
  - deel
  - clerk

workable:
  - huggingface

smartrecruiters:
  - AveryDennison   # industrial / materials
  - Ubisoft2        # gaming
  - Bosch           # industry / automotive — large, many non-tech functions
  - visa            # finance / payments
  - Oetker          # Dr. Oetker — food / FMCG (Bielefeld) — verify live

breezy:
  - vetsez

recruitee:   # ATS — subdomain from https://{company}.recruitee.com
  - vandebron        # Dutch energy company (verified live)
  # Add more: find the subdomain in a company's Recruitee careers URL.

# --- Job boards (one public feed each, many companies; "all" = whole feed) ---
personio:        # ATS — strong in Germany/DACH (find token at {company}.jobs.personio.de)
  - circus
  - wandelbots
  - 1komma5grad
remotive:
  - all
arbeitnow:     # Germany / EU
  - all
remoteok:
  - all
jobicy:
  - all
himalayas:
  - all
workingnomads:
  - all
weworkremotely:
  - all

pinpoint:        # ATS (find token at {company}.pinpointhq.com) — best-effort, verify live
  - workwithus

# softgarden — ATS very common in Germany/DACH. Public career feed at
# https://{slug}.career.softgarden.de/jobs.feed.json — slug is the employer's
# softgarden career subdomain. Great for German non-tech employers.
softgarden:
  - home24          # furniture e-commerce (non-tech)
  # Add German employers by their softgarden slug (from a job URL like
  # https://{slug}.career.softgarden.de/...). goldbeck's guessed slug 400'd —
  # add the real one once confirmed.

# --- New platforms (added in the +10 batch) ---------------------------------

# Workday — enterprise ATS. Token packs three parts the careers URL exposes:
#   tenant:wd{N}:site[:CompanyLabel]
# Find them in a company's Workday careers URL, e.g.
#   https://nvidia.wd5.myworkdayjobs.com/NVIDIAExternalCareerSite
#   -> nvidia : wd5 : NVIDIAExternalCareerSite
# Site ids and datacenter shard (wd1/wd3/wd5/wd12...) vary per company; a
# wrong token is skipped and logged, never fatal — verify live and add more.
workday:
  - nvidia:wd5:NVIDIAExternalCareerSite:NVIDIA

# Teamtailor — ATS (strong in the Nordics/Europe). Token = company subdomain
# from {company}.teamtailor.com. A public RSS feed is served at /jobs.rss.
teamtailor:
  - career          # Teamtailor's own careers board (demo of the connector)

# 4 Day Week — curated four-day-week / remote roles (public JSON API v2).
fourdayweek:
  - all

# Jobspresso — curated remote roles (WP Job Manager public feed).
jobspresso:
  - all

# Python.org Jobs — the official Python job board (RSS).
pythonjobs:
  - all

# Rise (joinrise.io) — cross-employer remote/tech feed (public JSON, no token).
# Paused: their API currently returns 504 Gateway Timeout. The connector is
# resilient (retries) — uncomment to re-enable when their service recovers.
# joinrise:
#   - all

# Rippling — ATS. Keyless board API. Token = the company's board slug (usually
# the company name lowercased), from an ats.rippling.com careers link. A wrong
# slug just 404s and is logged. Add real slugs you confirm live:
# rippling:
#   - <company-slug>

# HireHive — ATS. Token = company subdomain from {company}.hirehive.com.
# hirehive:
#   - <company-subdomain>

# Manatal — ATS. Token = the public career-page slug (careers-page.com).
# manatal:
#   - <career-page-slug>

# bamboohr — ATS (find token at {company}.bamboohr.com). Add a company:
# bamboohr:
#   - {subdomain}
# themuse is Cloudflare-protected (403 to API clients); connector kept but
# not run. Add an API key and re-enable if you register for one.
# themuse:
#   - all
