# Boards to index, grouped by platform.
#
# A "board" is the company's identifier on that platform. You find it in
# the company's careers URL, e.g.:
#   https://boards.greenhouse.io/gitlab        -> gitlab      (greenhouse)
#   https://jobs.lever.co/leverdemo            -> leverdemo   (lever)
#   https://jobs.ashbyhq.com/ramp              -> ramp        (ashby)
#   https://apply.workable.com/huggingface     -> huggingface (workable)
#   https://jobs.smartrecruiters.com/Ubisoft2  -> Ubisoft2    (smartrecruiters)
#   https://{company}.recruitee.com            -> {company}   (recruitee)
#   https://{company}.breezy.hr                -> {company}   (breezy)
#
# Add a company by dropping its board token on a new line. No code change
# needed. A token that doesn't exist is skipped (logged as a fetch
# failure), so it never breaks the run.

greenhouse:
  - gitlab
  - airbnb
  - stripe
  - figma
  - duolingo
  - robinhood
  - coinbase
  - databricks
  - dropbox
  - brex
  - lyft
  - reddit
  - discord
  - asana
  - cloudflare
  - mongodb
  - instacart
  # --- Africa (African employers on Greenhouse) ---
  - moniepoint      # 🇳🇬 fintech (EU-region board)
  - jumia           # pan-African e-commerce (EU-region board)
  - wavemm1         # 🇸🇳 Wave — mobile money
  - pawapay         # pan-African payments (EU-region board)
  # pulaio / okrainc removed: valid EU boards, but this machine's DNS to the
  # EU Greenhouse host is flaky — re-add when the network cooperates.
  # paystack removed: its public board isn't served by the Greenhouse API
  # (likely a private board). Re-add if you find the real board token.

lever:
  - leverdemo
  - spotify
  - palantir
  - zoox
  - whoop
  - gopuff
  - ro
  - entrata

ashby:
  - ramp
  - openai
  - linear
  - elevenlabs
  - notion
  - cursor
  - replit
  - supabase
  - docker
  - modal
  - posthog
  - mercury
  - vercel
  - deel
  - clerk

