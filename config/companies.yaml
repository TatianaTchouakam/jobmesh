# Boards to index, grouped by platform.
#
# A "board" is the company's identifier on that platform. You find it in
# the company's careers URL, e.g.:
#   https://boards.greenhouse.io/gitlab        -> gitlab      (greenhouse)
#   https://jobs.lever.co/leverdemo            -> leverdemo   (lever)
#   https://jobs.ashbyhq.com/ramp              -> ramp        (ashby)
#   https://apply.workable.com/huggingface     -> huggingface (workable)
#   https://jobs.smartrecruiters.com/Ubisoft2  -> Ubisoft2    (smartrecruiters)
#   https://{company}.recruitee.com            -> {company}   (recruitee)
#   https://{company}.breezy.hr                -> {company}   (breezy)
#
# Add a company by dropping its board token on a new line. No code change
# needed. A token that doesn't exist is skipped (logged as a fetch
# failure), so it never breaks the run.

greenhouse:
  - gitlab
  - airbnb
  - stripe
  - figma
  - duolingo
  - robinhood

lever:
  - leverdemo

ashby:
  - ramp

workable:
  - huggingface

smartrecruiters:
  - AveryDennison
  - Ubisoft2

breezy:
  - vetsez

recruitee:
  # Add a company that uses Recruitee, e.g. its subdomain from
  # https://{company}.recruitee.com — the connector is ready.
  []

# --- Job boards (one public feed each, many companies; "all" = whole feed) ---
personio:        # ATS — strong in Germany/DACH (find token at {company}.jobs.personio.de)
  - circus
  - wandelbots
  - 1komma5grad
remotive:
  - all
arbeitnow:     # Germany / EU
  - all
remoteok:
  - all
jobicy:
  - all
himalayas:
  - all
workingnomads:
  - all
weworkremotely:
  - all

pinpoint:        # ATS (find token at {company}.pinpointhq.com) — best-effort, verify live
  - workwithus

# bamboohr — ATS (find token at {company}.bamboohr.com). Add a company:
# bamboohr:
#   - {subdomain}
# themuse is Cloudflare-protected (403 to API clients); connector kept but
# not run. Add an API key and re-enable if you register for one.
# themuse:
#   - all
