# --- careersite : moteur JSON-LD (schema.org JobPosting) ---
# Le board est l'URL COMPLETE d'une page carriere / liste d'offres rendue
# cote serveur (Jobvite, Zoho, JazzHR, Recooty, logiciels de job board...).
# IMPORTANT : valide chaque URL AVANT de l'activer (voir test-eclair), car
# une page rendue en JS renverra 0 offre. Decommente celles qui renvoient >0.
careersite: []
#   - "https://jobs.jobvite.com/nutanix"
#   - "https://careers.example.com/jobs"
# --- jobfeed : parseur XML/RSS generique (logiciels de job board) ---
# Le board est l'URL COMPLETE d'un flux XML/RSS. SmartJobBoard = {domaine}/rss,
# WP Job Manager = {domaine}/?feed=job_feed. Valides via scripts/test_feeds.py.
jobfeed:
  - "https://www.proapartments.com/rss/"   # SmartJobBoard - ProApartments
