# --- smartjobboard : crawler sitemap -> pages -> JSON-LD (PROFONDEUR) ---
# Le board est l'URL de BASE du site (ex. https://academiccareers.com).
# Debloque tout le board (pas les 50 du flux rss). Plus lent : regle le
# plafond avec SMARTJOBBOARD_MAX_JOBS (defaut 400) et SMARTJOBBOARD_WORKERS.
# Pour l'activer : decommente ci-dessous ET commente les /rss equivalents
# dans la section jobfeed (sinon double indexation).
# --- sitemapjsonld : connecteur generique sitemap + schema.org JSON-LD ---
# board = "{url_sitemap}|{Societe}". La societe est optionnelle : l'omettre
# laisse chaque offre porter son propre employeur (hiringOrganization du
# JSON-LD) -- adapte aux portails multi-employeurs. Reutilise la recette iCIMS
# (sitemap -> pages -> JobPosting JSON-LD), robots respecte par URL, keyless.
sitemapjsonld:
  # EDJOIN — portail emploi education publique (Californie). robots Allow: /,
  # sitemap -> /sitemap/jobs/1 (~14,6k offres), JobPosting JSON-LD rendu serveur
  # sur chaque /Home/JobPosting/{id}. Societe par offre (district scolaire).
  # Pas de CGU restreignant l'acces automatise. Verifie live 26/11/2026.
  - "https://www.edjoin.org/sitemap.xml"
  # Jobdanmark — board generaliste danois (Umbraco). robots n'interdit que
  # /bin/ et /umbraco/ ; sitemap plat (~30k offres /job/{slug}) ; JobPosting
  # JSON-LD rendu serveur (le '+' du type MIME est encode en entite). Societe
  # par offre. Pas d'interdiction d'acces automatise. Verifie live 26/11/2026.
  - "https://jobdanmark.dk/sitemap"
  # NZ Government Jobs — portail emploi secteur public NZ. robots '*' n'interdit
  # que des routes /jobtools ; pages /jobs/{id} autorisees, JobPosting JSON-LD
  # rendu serveur. Societe = agence publique. Verifie live 26/11/2026.
  - "https://jobs.govt.nz/sitemap_index.xml"
  # Werken voor Nederland — emplois gouvernement neerlandais. sitemap dedie
  # ~1,3k /vacatures/{slug}, JobPosting JSON-LD serveur, societe = ministere.
  # robots permissif. Verifie live 26/11/2026.
  - "https://www.werkenvoornederland.nl/sitemap-vacatures.xml"
  # Just Join IT — board IT polonais. sitemap /sitemaps/active-jobs.xml,
  # pages /job-offer/{slug} autorisees (robots declare les sitemaps),
  # JobPosting JSON-LD serveur. Verifie live 26/11/2026.
  - "https://justjoin.it/sitemaps/active-jobs.xml"
  # VueJobs — board Vue/Nuxt. Le flux /feed est Disallow par robots, mais les
  # pages /jobs/{slug} sont autorisees et portent un JobPosting JSON-LD rendu
  # serveur ; on passe donc par le sitemap (~1k offres). Verifie live 26/11/2026.
  - "https://vuejobs.com/sitemap.xml"
  # Talenetic — board client multi-employeur (jobs.medicalupdateonline.com,
  # pied de page "Powered by Talenetic Job Board Software"). robots '*' n'interdit
  # que /jobseekers/ /sign-up/ /Rss-Feed* /job/*/application-form /job-search-results*
  # ; sitemap dédié des fiches -> /job-detail/{id}/{slug}/, JobPosting JSON-LD rendu
  # serveur, keyless. Employeur par offre (label "Partner Jobs" sur les offres
  # syndiquées). Vérifié live 27/11/2026 (offres ouvertes > 0).
  - "https://jobs.medicalupdateonline.com/sitemap-job-pages-1.xml"
  # eJobBoard — board client (liveincarejobs.co.uk). robots '*' autorise les fiches
  # /...-job{id} (interdits: /jobs/*, /results.php, recherche, comptes) et déclare le
  # sitemap ; fiches avec JobPosting JSON-LD rendu serveur, employeur réel par offre,
  # keyless. Vérifié live 27/11/2026 (offres ouvertes > 0).
  - "https://www.liveincarejobs.co.uk/sitemap.xml"

