# Declined sources — evaluated but deliberately NOT indexed, with the reason.
# Not part of the 78 and not counted; kept here for transparency (no connector
# runs for these). Separate from bonus_sources, which is live ACTIVE only.
declined_sources:
  - { name: "SpainJobs.io", connector: null, status: PARTNERSHIP_REQUIRED,
      reason: "Technically readable (robots '*' Allow: /, server-rendered JobPosting JSON-LD on /companies/{company}/{slug}, ~120k jobs across jobs-0/1/2.xml), BUT robots.txt names and blocks commercial data-aggregator crawlers (CCBot, Diffbot, omgili/omgilibot, Webzio-Extended) specifically from /companies/ — exactly where the job listings live, and omgili/Webz.io is itself a job-data reseller. Under our no-bypass / respect-operator-intent rule we decline to harvest a board that explicitly keeps third-party job-data aggregators off its listings, even though the generic '*' group would permit JobmeshBot. Verified 26/11/2026.",
      next_action: "EXCLUDED — operator robots blocks named job-data aggregators from the listings path; revisit only via an official syndication agreement", request_status: "No partner contact attempted (public board, no published feed/API)" }
