# Declined sources — evaluated but deliberately NOT indexed, with the reason.
# Not part of the 78 and not counted; kept here for transparency (no connector
# runs for these). Separate from bonus_sources, which is live ACTIVE only.
declined_sources:
  - { name: "SpainJobs.io", connector: null, status: PARTNERSHIP_REQUIRED,
      reason: "Technically readable (robots '*' Allow: /, server-rendered JobPosting JSON-LD on /companies/{company}/{slug}, ~120k jobs across jobs-0/1/2.xml), BUT robots.txt names and blocks commercial data-aggregator crawlers (CCBot, Diffbot, omgili/omgilibot, Webzio-Extended) specifically from /companies/ — exactly where the job listings live, and omgili/Webz.io is itself a job-data reseller. Under our no-bypass / respect-operator-intent rule we decline to harvest a board that explicitly keeps third-party job-data aggregators off its listings, even though the generic '*' group would permit JobmeshBot. Verified 26/11/2026.",
      next_action: "EXCLUDED — operator robots blocks named job-data aggregators from the listings path; revisit only via an official syndication agreement", request_status: "No partner contact attempted (public board, no published feed/API)" }
  - { name: "Poslovi Infostud", connector: null, status: PARTNERSHIP_REQUIRED, reason: "Serbia board; robots '*' would allow /posao/ job pages (server-rendered JobPosting JSON-LD confirmed), BUT robots.txt blocks the job aggregator Jooble by name across the whole site (User-agent: jooblebot -> Disallow: /). Under our respect-operator-intent rule we don't harvest a board that explicitly keeps a job aggregator out. Verified 26/11/2026.", next_action: "EXCLUDED — operator blocks a job aggregator (Jooble) by name; revisit via official syndication", request_status: "none" }
  - { name: "Ethiojobs", connector: null, status: PARTNERSHIP_REQUIRED, reason: "Ethiopia board; robots.txt blocks aggregator/AI crawlers by name (CCBot, ClaudeBot, GPTBot, Bytespider, Amazonbot, Applebot-Extended, ChatGPT-User) and job pages expose no server-rendered JobPosting JSON-LD and no public RSS/XML job feed. Verified 26/11/2026.", next_action: "EXCLUDED — named-crawler blocks + no token-free structured route", request_status: "none" }
  - { name: "Choisir le service public", connector: null, status: API_REQUIRED, reason: "France public-service portal; the sitemap carries editorial HTML pages only (no JobPosting JSON-LD) and there is no RSS/XML job feed — offers are API/JS-rendered. A separate open-data API exists but is out of scope for the sitemap/feed connectors. Verified 26/11/2026.", next_action: "DEFERRED — official open-data API integration (separate connector)", request_status: "none" }
