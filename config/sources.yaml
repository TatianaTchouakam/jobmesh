# JobMesh source registry — the integration status of every REQUIRED platform.
# Statuses (technical vs commercial are kept separate, on purpose):
#   ACTIVE                       live, robots-permitted, keyless — real jobs in the index
#   API_REQUIRED                 official API / credentials needed (no page-lifted token)
#   PARTNERSHIP_REQUIRED         a commercial/publisher agreement is needed
#   CLIENT_CONNECTION_REQUIRED   an employer must connect their own account/feed
#   TEMPORARILY_UNAVAILABLE      service down / anti-bot / no functioning board right now
#   RETIRED                      platform merged/acquired, no standalone public surface
# Only ACTIVE sources run in the daily ingest. The rest are declared, not failed,
# and never counted as covered. Bonus (non-78) sources live in companies.yaml.

