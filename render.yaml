# Render deployment blueprint for Jobmesh.
#
# The index lives on a persistent disk (/var/data) so it survives redeploys;
# a background thread refreshes it on startup and every INGEST_INTERVAL_HOURS.
# The service runs on a Standard instance (2 GB RAM, always on) with a 10 GB disk.
#
# Secret env vars (STRIPE_*, BASE_URL) are set in the Render dashboard
# (declared here with sync:false). SECRET_KEY is generated once by Render.
services:
  - type: web
    name: jobmesh
    runtime: python
    plan: standard
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn jobmesh.api:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health   # Render waits for a 200 here before routing; startup answers in seconds (heavy migration runs in the background)
    disk:
      name: jobmesh-data
      mountPath: /var/data
      sizeGB: 10
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: SECRET_KEY            # signs Jobmesh Premium keys
        generateValue: true
      - key: STRIPE_SECRET_KEY     # set in dashboard (secret)
        sync: false
      - key: STRIPE_PRICE_ID
        sync: false
      - key: BASE_URL             # e.g. https://jobmesh.world
        sync: false
      - key: JOBMESH_DB            # SQLite path on the persistent disk
        value: "/var/data/jobmesh.db"
      - key: INGEST_MAX_BOARDS     # per-platform board cap; high on the 2 GB Standard plan
        value: "3000"
      - key: INGEST_INTERVAL_HOURS  # background self-refresh cadence (hours)
        value: "4"
      - key: INGEST_WORKERS         # fetch concurrency — 2 GB Standard plan allows more
        value: "6"
      # Optional keys for keyed sources (leave unset to skip those sources)
      - key: JOOBLE_API_KEY
        sync: false
      - key: REED_API_KEY
        sync: false
      - key: USAJOBS_API_KEY
        sync: false
      - key: USAJOBS_EMAIL
        sync: false
      - key: RELIEFWEB_APPNAME
        sync: false
      # PayPal subscription billing (alongside Stripe). Create a REST app at
      # developer.paypal.com, then run `python -m jobmesh.cli paypal-setup`
      # once to get the plan id. Leave unset to simply hide the PayPal button.
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_PLAN_ID
        sync: false
      - key: PAYPAL_ENV
        sync: false
